# 토스증권 종목 커뮤니티 크롤러 설정 파일
# CLI 인자 또는 대화형 입력이 없을 경우 아래 기본값이 적용됩니다.

target:
  default_stock_code: "005930"  # 기본 종목코드 (삼성전자 -> URL 접속 시 A005930 자동 변환)
  base_url: "https://tossinvest.com/stocks/{toss_code}/community"

collection:
  sort: "latest"                # 기본 정렬 기준: "latest" (최신순) | "popular" (인기순)
  max_posts: 20                 # 기본 수집 게시글 수 (--max-posts 미지정 시)
  since_date: null              # 수집 종료 기준일 (예: "2026-11-18", 미지정 시 null)
  expand_long_posts: true       # 긴 글 '더보기' 자동 확장 여부
  expand_all_comments: true     # 댓글 더보기 / 답글 N개 보기 자동 확장 여부
  handle_login_modal: true      # 로그인 유도 팝업 닫기 및 수동 로그인 대기 지원 여부

browser:
  headless: false               # 반드시 브라우저 창을 띄워 시각적으로 모니터링
  viewport:
    width: 1280
    height: 900
  locale: "ko-KR"
  timezone_id: "Asia/Seoul"
  user_agent: null              # null일 경우 Playwright 기본 최신 크롬 User-Agent 사용
  user_data_dir: null           # 브라우저 로그인 세션 유지용 프로필 폴더 경로 (선택, 예: ".browser_profile")
  engine: "playwright_hybrid"   # "playwright_hybrid" (DOM + Network JSON 가로채기 병행) | "playwright_dom"

human_interaction:
  mouse_move_steps_min: 12      # 마우스 커서 이동 분할 최소 단계
  mouse_move_steps_max: 28      # 마우스 커서 이동 분할 최대 단계
  click_offset_px: 5            # 클릭 좌표 랜덤 오프셋 범위 (±픽셀)
  typing_delay_min_ms: 50       # 타이핑 글자당 최소 딜레이 (ms)
  typing_delay_max_ms: 150      # 타이핑 글자당 최대 딜레이 (ms)
  action_wait_min_sec: 1.0      # 스크롤/클릭 후 최소 대기 시간 (초)
  action_wait_max_sec: 2.8      # 스크롤/클릭 후 최대 대기 시간 (초)
  scroll_step_min_px: 250       # 1회 마우스 휠 스크롤 최소 픽셀
  scroll_step_max_px: 550       # 1회 마우스 휠 스크롤 최대 픽셀

storage:
  output_dir: "output"
  filename_template: "output_toss_{stock_name}_{stock_code}.json"
  log_dir: "logs"
  checkpoint_per_post: true     # 게시글 1개 세트 수집 완료 시마다 즉시 중간 저장
